# =============================================================================
# DC-Ops SFT configuration — Qwen3-8B on MI300X (192 GB HBM3)
# =============================================================================
# CLI overrides: python scripts/train_sft.py --config configs/sft.yaml \
#                  --set training.num_train_epochs=3 run.name=v2
# =============================================================================

run:
  name: "qwen3-8b-dcops-sft-v1"
  output_dir: "./outputs/qwen3-8b-dcops-sft-v1"
  seed: 3407
  wandb_project: "dc-ops-sft"
  wandb_entity: null
  report_to: "wandb"      # "wandb" | "none"

# -----------------------------------------------------------------------------
# Model — Qwen3-8B, bf16 LoRA (not QLoRA).
# -----------------------------------------------------------------------------
# Rationale:
#   • 192 GB HBM → no need to quantize.
#   • Unsloth docs explicitly warn that Qwen3 QLoRA has higher-than-usual
#     quantization error ("Not recommended to do QLoRA on Qwen3.x").
#   • Merged bf16 weights drop straight into GRPO with vLLM fast_inference=True.
# -----------------------------------------------------------------------------
model:
  name: "unsloth/Qwen3-8B"
  max_seq_length: 8192
  dtype: "bfloat16"
  load_in_4bit: false
  load_in_16bit: true
  full_finetuning: false
  thinking_mode: true

# -----------------------------------------------------------------------------
# LoRA — all-linear, r=32 (higher than default because VRAM is plentiful).
# -----------------------------------------------------------------------------
lora:
  r: 32
  alpha: 32
  dropout: 0.0
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  gradient_checkpointing: false
  use_rslora: false

# -----------------------------------------------------------------------------
# Data — Melikshah/dc-ops-sft-data, fanned out per-turn.
# -----------------------------------------------------------------------------
# hf_dataset_file: explicitly pinned to "train.jsonl" so we don't accidentally
# also slurp in "train_with_meta.jsonl" (same data, different schema).
# fan_out=true: 1083 episodes -> ~8387 prompt-completion pairs, each one
# supervising the agent's <think>+<reasoning>+<command> output. This avoids
# the Qwen3 template's "strip <think> from non-final assistant" behavior that
# would otherwise waste most of the R1-distilled thinking data.
# -----------------------------------------------------------------------------
data:
  hf_dataset: "Melikshah/dc-ops-sft-data"
  hf_dataset_split: "train"
  hf_dataset_file: "train.jsonl"
  local_jsonl: null
  fan_out: true
  eval_size: 100
  num_proc: 8
  min_completion_chars: 50
  shuffle_seed: 3407

# -----------------------------------------------------------------------------
# Training — target ~2 h on one MI300X.
# -----------------------------------------------------------------------------
# Budget math (1 MI300X, ~8387 fanned examples):
#   effective batch = 4 * 4 = 16
#   ~525 optimizer steps per epoch -> 2 epochs ~= 1050 steps
#   With packing at seq_len 8192 + Unsloth SDPA on MI300X, expect
#   ~6-8 s/step -> 1.8-2.3 h total.
#
# optim: we use adamw_torch_fused (native PyTorch fused AdamW). On LoRA
# (~50 MB optimizer state) the bitsandbytes 8-bit savings are irrelevant,
# and ROCm bnb has a known NaN-during-decode issue per Unsloth maintainers.
# -----------------------------------------------------------------------------
training:
  num_train_epochs: 2
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  optim: "adamw_torch_fused"    # was adamw_8bit; fused is safe on ROCm + LoRA
  bf16: true
  fp16: false
  packing: true
  completion_only_loss: true
  logging_steps: 1
  save_steps: 100
  save_total_limit: 3
  eval_strategy: "steps"
  eval_steps: 50
  save_merged_16bit: true
  save_lora_only: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  group_by_length: false        # disabled — breaks packing
  remove_unused_columns: false

# -----------------------------------------------------------------------------
# Inference eval — after SFT, run N episodes against the live env.
# -----------------------------------------------------------------------------
eval:
  scenarios: ["A1", "A2", "A4", "B1", "B3", "B4"]
  episodes_per_scenario: 3
  max_new_tokens: 1024
  temperature: 0.6              # Qwen3 thinking-mode default
  top_p: 0.95
  top_k: 20
  history_window: 16

# -----------------------------------------------------------------------------
# HF Hub
# -----------------------------------------------------------------------------
hub:
  repo_id: "Melikshah/qwen3-8b-dcops-sft"
  private: false
  push_merged: true
  push_lora: true
  commit_message: "SFT — Qwen3-8B on DC-Ops (bf16 LoRA r=32, 2 epochs)"
