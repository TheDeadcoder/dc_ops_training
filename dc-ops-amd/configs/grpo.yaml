# ============================================================================
# DC-Ops GRPO config — sized for AMD Instinct MI300X (192 GB VRAM)
# ----------------------------------------------------------------------------

# ----- Data ------------------------------------------------------------------
data:
  num_initial_prompts: 30                  
  num_midgame_prompts: 55                  
  seed: 42
  hf_source: "Melikshah/dc-ops-sft-data"
  local_jsonl: null

# ----- Model (loaded from the SFT LoRA checkpoint) --------------------------
model:
  sft_model_hub: "Melikshah/dc-ops-sft-lora-new"
  sft_model_local: "./outputs/dc_ops_sft_lora"
  max_seq_length: 3072
  load_in_4bit: true
  max_lora_rank: 16

# ----- vLLM fast-inference (Unsloth path) -----------------------------------
vllm:
  enabled: true
  gpu_memory_utilization: 0.65
  enforce_eager: true
  temperature: 0.9                       
  top_p: 0.9                               

# ----- GRPO training hyperparams --------------------------------------------
grpo:
  output_dir: "./outputs/grpo"

  # Group / rollout sizing
  num_generations: 8
  max_prompt_length: 2048
  max_completion_length: 512

  # Optimizer step sizing
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  use_gradient_checkpointing: "unsloth"

  num_train_epochs: 7                     
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  beta: 0.05                               
  max_grad_norm: 0.1

  bf16: true
  fp16: false

  logging_steps: 1
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3

  dataloader_num_workers: 0
  seed: 3407

# ----- Save ------------------------------------------------------------------
save:
  local_dir: "./outputs/dc_ops_grpo_final"

# ----- Weights & Biases -----------------------------------------------------
wandb:
  enabled: true
  project: "dc-ops-amd"
  run_name: "grpo-qwen2.5-7b-mi300x"
  tags: ["grpo", "mi300x", "rocm72", "qwen2.5-7b", "vllm"]