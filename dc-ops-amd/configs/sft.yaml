# DC-Ops SFT config — AMD Instinct MI300X (192 GB VRAM)

# ----- Data ------------------------------------------------------------------
data:
  hf_source: "Melikshah/dc-ops-sft-data"
  local_jsonl: null
  eval_split: 0.05
  seed: 42

# ----- Model -----------------------------------------------------------------
model:
  name: "unsloth/Qwen2.5-7B-Instruct"
  max_seq_length: 3072
  load_in_4bit: true
  dtype: "bfloat16"

# ----- LoRA ------------------------------------------------------------------
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: "unsloth"
  random_state: 3407

# ----- SFT training hyperparams ---------------------------------------------
sft:
  output_dir: "./outputs/sft"

  per_device_train_batch_size: 10
  gradient_accumulation_steps: 2

  # 2 epochs: eval_loss bottoms at epoch ~1.33 then rises sharply.
  # Running to epoch 4 causes progressive overfitting (2.696 → 2.827).
  # GRPO provides further refinement, so early SFT stopping is correct.
  num_train_epochs: 2
  learning_rate: 7.0e-5                    # was 1e-4 — slightly lower for stability
  lr_scheduler_type: "cosine"
  warmup_steps: 10
  weight_decay: 0.01
  max_grad_norm: 1.0

  bf16: true
  fp16: false

  logging_steps: 5
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 4
  load_best_model_at_end: true             # saves best eval_loss checkpoint
  metric_for_best_model: "eval_loss"

  dataloader_num_workers: 0
  dataloader_pin_memory: true

  packing: false
  dataset_text_field: "text"

  seed: 3407

# ----- Save / push -----------------------------------------------------------
save:
  local_dir: "./outputs/dc_ops_sft_lora"

# ----- Post-SFT verification -------------------------------------------------
verify_after_train:
  enabled: true
  scenario: "A2"
  seed: 42
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9

# ----- Weights & Biases ------------------------------------------------------
wandb:
  enabled: true
  project: "dc-ops-amd"
  run_name: "sft-qwen2.5-7b-mi300x"
  tags: ["sft", "mi300x", "rocm72", "qwen2.5-7b", "qlora"]